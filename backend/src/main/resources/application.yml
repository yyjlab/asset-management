spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: asset-management
  datasource:
    url: jdbc:h2:file:./data/assets;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

asset:
  admin:
    username: ${ASSET_ADMIN_USERNAME:admin}
    password: ${ASSET_ADMIN_PASSWORD:ChangeMe123!}

app:
  public-base-url: ${ASSET_PUBLIC_BASE_URL:}
  asset-images:
    directory: ${ASSET_IMAGE_DIRECTORY:./data/asset-images}
  workflow-notifications:
    enabled: ${ASSET_WORKFLOW_NOTIFY_ENABLED:false}
    webhook: ${ASSET_WORKFLOW_DINGTALK_WEBHOOK:}
    secret: ${ASSET_WORKFLOW_DINGTALK_SECRET:}
  dingtalk-login:
    enabled: ${DINGTALK_LOGIN_ENABLED:false}
    client-id: ${DINGTALK_LOGIN_CLIENT_ID:}
    client-secret: ${DINGTALK_LOGIN_CLIENT_SECRET:}
    redirect-uri: ${DINGTALK_LOGIN_REDIRECT_URI:}
    state-ttl-seconds: ${DINGTALK_LOGIN_STATE_TTL_SECONDS:600}
    timeout-seconds: ${DINGTALK_LOGIN_TIMEOUT_SECONDS:10}
