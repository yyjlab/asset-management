name: Build macOS collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-macos-collection-launcher.sh
      - .github/workflows/macos-collector.yml
      - backend/src/main/resources/windows-collection/CollectMac.js
      - scripts/collection-launchers/test-macos-bridge.js
      - scripts/test-macos-runtime.cjs
      - scripts/collection-launchers/WrapMacImage.java
      - scripts/collection-launchers/MacLauncher.m
      - backend/src/main/java/com/acme/assetmanagement/integration/deployment/MacDiskImage.java
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test real collector Foundation bridges
        run: node scripts/test-macos-runtime.cjs
      - name: Build and mount-test DMG template
        run: bash scripts/build-macos-collection-launcher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-collector-template
          path: backend/src/main/resources/windows-collection/native/macos-template.dmg
          if-no-files-found: error
          retention-days: 7
